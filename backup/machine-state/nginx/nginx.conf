worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name arouter.alterdev.site;

        location ^~ /.well-known/acme-challenge/ {
            root C:/nginx-1.30.0/html;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            proxy_pass http://127.0.0.1:5001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            tcp_nodelay on;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name arouter.alterdev.site;

        ssl_certificate      C:/nginx-1.30.0/conf/ssl/arouter.alterdev.site-chain.pem;
        ssl_certificate_key  C:/nginx-1.30.0/conf/ssl/arouter.alterdev.site-key.pem;

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 50m;

        location / {
            proxy_pass http://127.0.0.1:1508;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_buffering off;
        }
    }
}
